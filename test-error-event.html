<html>

<style>
  body {
    display: grid;
    grid-template-areas: "control log";
  }

  .controls {
    grid-area: control;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .event-log {
    grid-area: log;
  }

  .event-log-contents {
    resize: none;
  }

  label,
  button {
    display: block;
  }

  button {
    height: 2rem;
    margin: 0.5rem;
  }

  img {
    width: 0;
    height: 0;
  }
</style>

<body>
  <div class="controls">
    <button id="img-error" type="button">Generate image error</button>
    <div class="bad-img">
      <img src="none" />

    </div>
  </div>

  <div class="event-log">
    <label for="eventLog">Event log:</label>
    <textarea readonly class="event-log-contents" rows="8" cols="30" id="eventLog"></textarea>
  </div>


  <script>
    const log = document.querySelector(".event-log-contents");

    const badImg = document.querySelector(".bad-img img");
    //  badImg.addEventListener("error", (event) => {
    // //   //log.textContent += `${event.type}: Loading image\n`;
    //    console.log(event);
    //  });

    const imgError = document.querySelector("#img-error");
    imgError.addEventListener("click", () => {
      addEvent();
      openFullscreen()
      badImg.refresh();
      // badImg.setAttribute("src", "i-dont-exist");
    });

    function addEvent() {
      badImg.addEventListener("error", (event) => {
        console.log(event);
      });
    }
    
    var elem = document.documentElement;
    function openFullscreen() {
      if (elem.requestFullscreen) {
        elem.requestFullscreen();
      } else if (elem.webkitRequestFullscreen) { /* Safari */
        elem.webkitRequestFullscreen();
      } else if (elem.msRequestFullscreen) { /* IE11 */
        elem.msRequestFullscreen();
      }
    }

  </script>

</body>

</html>
